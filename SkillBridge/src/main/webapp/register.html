<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>SkillBridge - Register</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fa;
        }

        .register-container {
            max-width: 650px;
            margin: 50px auto;
        }

        .register-card {
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            background: white;
        }

        .register-card h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-register {
            width: 100%;
            transition: transform 0.3s ease;
        }

        .btn-register:hover {
            transform: scale(1.03);
        }

    </style>

</head>

<body>

    <!-- Registration Container -->

    <div class="container register-container">

        <div class="register-card">

            <h2>Create Your SkillBridge Account</h2>

            <form name="Regisration page" action="RegisterServlet" method="post">

                <!-- Username -->

                <div class="mb-3">

                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="Enter username" required>

                </div>


                <!-- First Name -->

                <div class="mb-3">

                    <label for="fname" class="form-label">
                        First Name
                    </label>

                    <input type="text"
                           class="form-control"
                           id="fname"
                           name="fname"
                           placeholder="Enter first name" required>

                </div>


                <!-- Last Name -->

                <div class="mb-3">

                    <label for="lname" class="form-label">
                        Last Name
                    </label>

                    <input type="text"
                           class="form-control"
                           id="lname"
                           name="lname"
                           placeholder="Enter last name" >

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           placeholder="Enter email" required>

                </div>

			<!-- Mobile Number -->

<div class="mb-3">

    <label for="mobile" class="form-label">
        Mobile Number
    </label>

    <input type="tel"
           class="form-control"
           id="mobile"
           name="mobile"
           placeholder="Enter mobile number"
           maxlength="10">

</div>

                <!-- Password -->

                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Enter password" required>

                </div>


                <!-- Confirm Password -->

                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Confirm password" required>

                </div>


                <!-- Register Button -->

                <button type="submit"
                        class="btn btn-primary btn-register">

                    Register

                </button>


                <!-- Login Link -->

                <p class="text-center mt-3">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </div>

</body>

</html>
